# Reglas – Menores de 5 años (VEA-2 / AR02). Base B1; diccionario D1; observaciones O1 hoja MENOR 5.
# Las páginas de G1 e I1 corresponden a la numeración del PDF.
poblaciones: [menores5]

listas:
  sintomas_ausentismo: &SINT [P7_Sibilancia_Alguna_Vez, P8_Sibilancia_Ultimo_Año, P10_Desp_Silbidos_Mas_De_Una_Vez_Semana,
                              P11_Sibilancia_ImpideHabla, P12_Sibilancia_Act_Fisica, P15_Tos_Ultimo_Año_Dif_Gripa,
                              P16_Tos_Ejercicio_Leve, P17_Tos_Risa_Llanto, P18_Despierta_Tos]
  meses: &MESES [P6_Enero, P6_Febrero, P6_Marzo, P6_Abril, P6_Mayo, P6_Junio, P6_Julio, P6_Agosto, P6_Septiembre,
                 P6_Octubre, P6_Noviembre, P6_Diciembre]
  colegio: &COLEGIO [P4_Colegio, P4_Dirección_Colegio, P4_Localidad_Colegio, P4_Num_UPZ_Colegio, P4_UPZ_Colegio]
  p76: &P76 [P76_Agricultura_Ganaderia, P76_Explotación_Minas, P76_Venta_Material_Construcción, P76_Reparacion_Vehiculos,
             P76_Restaurantes_Chimenea, P76_Parqueadero_Buses, P76_Bares_Cantinas, P76_Industria_Manufacturera,
             P76_Incineradores, P76_Quemas_Cielo_Abierto, P76_Zona_Reciclaje, P76_Obras_Construcción,
             P76_Establecimientos_Culto, P76_Ornamentación, P76_Canales_Agua, P76_Lavandería]
  p24: &P24 [P24_Trastorno_Hipertensivo_Embarazo, P24_Anemia, P24_Diabetes_Gestacional, P24_IVU, P24_Desnutrición, P24_Otro_Antecedente]
  mascotas_dep: &MASC [P68_Tiene_Gatos, P68_Cuantos_Gatos, P68_Tiene_Perros, P68_Cuantos_Perros, P68_Tiene_Aves, P68_Cuantas_Aves,
                       P68_Tiene_Otros, P68_Cuantos_Otros, P68_Cuales_Otros, P69_Donde_Duermen_Mascotas, DUERMEN MASCOTAS CODIF.,
                       P70_Niño_Convive_Mascotas]
  diligenciado_no_999: &DIL {todas: [{vacio: false}, {no_en: [999]}]}

reglas:
  # ================================================================= A. Información general
  - id: M5_ACTA_FORMATO
    descripcion: "Número de acta de 11 caracteres: AR + 02 (encuesta menores de 5) + sigla de subred + 6 dígitos"
    tipo: patron
    variables: [No_Acta]
    parametros: {patron: "AR02[NSEC]\\d{6}", descripcion_esperado: "AR02 + N/S/E/C + 6 dígitos (p. ej. AR02E000001)"}
    severidad: error
    fuentes:
      - {doc: I1, ubicacion: "pp.143-144", nota: "Anexo 1: AR02 = Encuesta de prevalencia niños menores de 5 años"}
      - {doc: G1, ubicacion: "p.4", nota: "número de acta igual al de la encuesta AR02"}
    accion: "Corregir el número de acta según el formato físico."

  - id: M5_TIPODOC_DOMINIO
    descripcion: "Tipo de documento del menor dentro de las opciones documentadas"
    tipo: dominio
    variables: [Tipo_Documento]
    parametros: {valores: [NUIP, PEP, PPT, "Documento de Extranjería", "Documento de extranjeria"]}
    severidad: error
    fuentes:
      - {doc: D1, ubicacion: "filas 9-12"}
      - {doc: I1, ubicacion: "p.12"}
    accion: "Verificar el tipo de documento en el registro civil o documento migratorio."

  - id: M5_ID_NUIP_NUMERICO
    descripcion: "Si el documento es NUIP, la identificación contiene solo dígitos"
    tipo: patron
    variables: [Identificación]
    aplica_si: {var: Tipo_Documento, en: [NUIP]}
    parametros: {patron: "\\d+", descripcion_esperado: "solo dígitos"}
    severidad: error
    fuentes:
      - {doc: G1, ubicacion: "p.5", nota: "valor numérico; verificar que no tenga caracteres adicionales"}
      - {doc: I1, ubicacion: "p.12", nota: "NUIP revisado en el registro civil; no válido cédula de padres ni código de carné"}
    accion: "Verificar el NUIP en el registro civil."

  - id: M5_ID_DE_SIGLA
    descripcion: "Si el documento es de extranjería, la identificación inicia con la sigla en mayúscula seguida del número"
    tipo: patron
    variables: [Identificación]
    aplica_si: {var: Tipo_Documento, en: ["Documento de Extranjería", PEP, PPT]}
    parametros: {patron: "[A-Z]{2,4}\\s?\\d+", descripcion_esperado: "sigla en mayúsculas + número (p. ej. PPT 1234567)"}
    severidad: alerta
    fuentes:
      - {doc: I1, ubicacion: "p.8, p.12", nota: "siglas en mayúscula sostenida seguidas del número, ejemplo PPT 1234567"}
      - {doc: D1, ubicacion: "fila 13"}
      - {doc: O1, ubicacion: "MENOR 5 fila 10"}
    accion: "Completar la sigla del documento de extranjería."

  - id: M5_SEXO_DOMINIO
    descripcion: "Sexo: Hombre, Mujer o Intersexual"
    tipo: dominio
    variables: [Sexo]
    parametros: {valores: [Hombre, Mujer, Intersexual]}
    severidad: error
    fuentes:
      - {doc: I1, ubicacion: "p.12", nota: "Hombre, Mujer, Intersexual; no puede quedar en blanco"}
      - {doc: D1, ubicacion: "filas 14-15"}
    accion: "Corregir según el formato físico. El validador no infiere el sexo a partir del nombre."

  - id: M5_SEXO_COD
    descripcion: "Sexo- Cod: Hombre = 1, Mujer = 2"
    tipo: recodificacion_mapa
    etapa: recodificacion
    parametros:
      origen: Sexo
      destino: "Sexo- Cod"
      mapa: {Hombre: 1, Mujer: 2}
      conflicto: {Intersexual: "la codificación de Intersexual en Sexo- Cod no está documentada"}
    severidad: error
    fuentes:
      - {doc: O1, ubicacion: "MENOR 5 fila 12"}
      - {doc: D1, ubicacion: "filas 16-17"}
    accion: "Recalcular la codificación a partir de la respuesta original."

  - id: M5_EDAD_CALCULADA
    descripcion: "Edad en meses cumplidos a la fecha de encuesta coincide con Edad_Meses"
    tipo: funcion
    variables: [Edad_Meses]
    parametros: {nombre: edad_calculada, args: {nacimiento: Fecha_Nacimiento, encuesta: Fecha_Encuesta, edad: Edad_Meses}, opciones: {unidad: meses}}
    severidad: error
    fuentes:
      - {doc: I1, ubicacion: "p.13", nota: "calculada por SIVIGILA con fecha de nacimiento y fecha de encuesta; número de meses de vida"}
      - {doc: G1, ubicacion: "p.5", nota: "se aconseja verificar la información"}
    accion: "Verificar fecha de nacimiento, fecha de encuesta y edad contra el soporte."

  - id: M5_EDAD_POBLACION
    descripcion: "Criterio de inclusión: el menor tiene entre 2 y 59 meses a la fecha de encuesta"
    tipo: funcion
    variables: [Fecha_Nacimiento]
    parametros: {nombre: edad_poblacion, args: {nacimiento: Fecha_Nacimiento, encuesta: Fecha_Encuesta, etiqueta: "Edad (calculada)"}, opciones: {unidad: meses, min: 2, max: 59}}
    severidad: bloqueante
    fuentes:
      - {doc: I1, ubicacion: "p.10, p.13", nota: "el menor debe encontrarse entre los 2 a 59 meses"}
      - {doc: D1, ubicacion: "fila 19"}
    accion: "Verificar la fecha de nacimiento; si es correcta, el registro no pertenece a esta base."

  - id: M5_EDAD_COD
    version: 2
    descripcion: "Edad_Meses_COD: 1 = 2 a 11 meses; 2 = 12 a 59 meses (diccionario; decisión DP-02)"
    tipo: recodificacion_intervalos
    etapa: recodificacion
    parametros:
      origen: Edad_Meses
      destino: Edad_Meses_COD
      intervalos: [{min: 2, max: 11, valor: 1}, {min: 12, max: 59, valor: 2}]
    severidad: error
    fuentes:
      - {doc: D1, ubicacion: "filas 20-21", nota: "1 = 2 a 11 meses; 2 = 12 a 59 meses"}
      - {doc: O1, ubicacion: "MENOR 5 fila 15", nota: "menor o igual a 12 meses = 1; no se aplica por decisión DP-02 (20/10/2026)"}
    accion: "Recalcular la codificación a partir de la edad en meses."

  - id: M5_GRUPO_ETNICO_DOMINIO
    descripcion: "Grupo étnico dentro de las opciones del formato"
    tipo: dominio
    variables: [Grupo_etnico]
    parametros: {valores: [Indígena, ROM, Palenquero, Afrodescendiente, Raizal, Ninguno]}
    severidad: error
    fuentes:
      - {doc: D1, ubicacion: "fila 22"}
      - {doc: G1, ubicacion: "p.5"}
    accion: "Corregir según el formato físico."

  - id: M5_TIPODOC_ENC_DOMINIO
    descripcion: "Tipo de documento del encuestado dentro de las opciones documentadas"
    tipo: dominio
    variables: [Tipo_Documento_Encuestado]
    parametros: {valores: ["Cédula de Ciudadanía", "Cédula de Extranjería", PEP, PPT, "Permiso por Protección Temporal", "Permiso de Protección Temporal", "Documento de Extranjería"]}
    severidad: error
    fuentes:
      - {doc: D1, ubicacion: "filas 39-42"}
      - {doc: I1, ubicacion: "p.15"}
    accion: "Corregir según el formato físico."

  - id: M5_ID_ENC_CC_NUMERICO
    descripcion: "Si el encuestado tiene cédula de ciudadanía, la identificación contiene solo dígitos"
    tipo: patron
    variables: [Identificación_Encuestado]
    aplica_si: {var: Tipo_Documento_Encuestado, en: ["Cédula de Ciudadanía"]}
    parametros: {patron: "\\d+", descripcion_esperado: "solo dígitos"}
    severidad: error
    fuentes:
      - {doc: G1, ubicacion: "p.6", nota: "valor numérico; verificar que no tenga caracteres adicionales; sin 999 ni 9999"}
    accion: "Verificar el número de documento."

  - id: M5_ID_ENC_TEXTO
    descripcion: "La identificación del encuestado se almacena como texto"
    tipo: almacenado_como_texto
    variables: [Identificación_Encuestado]
    severidad: alerta
    fuentes:
      - {doc: DX, ubicacion: "secciones 2 y 4"}
    accion: "Formatear como texto y verificar que no se hayan perdido dígitos."

  - id: M5_PARENTESCO_REVISION
    descripcion: "Parentesco distinto de madre o padre: debe constar en observaciones el soporte (sentencia judicial)"
    tipo: revision
    estado: revision_humana
    variables: [Parentesco_Encuestado, Observaciones]
    aplica_si: {var: Parentesco_Encuestado, no_en: [MADRE, PADRE]}
    parametros: {solicitud: "Verificar en observaciones la delegación por sentencia judicial y el soporte adjunto."}
    severidad: revision
    fuentes:
      - {doc: O1, ubicacion: "MENOR 5 fila 27"}
      - {doc: G1, ubicacion: "p.7"}
      - {doc: I1, ubicacion: "p.8, p.17"}

  # ================================================================= Ubicación
  - id: M5_ZONA_DOMINIO
    descripcion: "Zona_Urbana: 1 urbana, 2 rural"
    tipo: dominio
    variables: [Zona_Urbana]
    parametros: {valores: [1, 2]}
    severidad: error
    fuentes:
      - {doc: D1, ubicacion: "filas 45-46"}
    accion: "Corregir según el formato físico."

  - id: M5_ZONA_RURAL_SUMAPAZ
    descripcion: "Si la localidad no es Sumapaz, Zona_Urbana = 1 (solo Subred Sur en Sumapaz encuesta zona rural)"
    tipo: condicional
    variables: [Zona_Urbana]
    aplica_si: {var: Localidad, no_en: [Sumapaz]}
    parametros: {entonces_cada: {en: [1]}, explicacion: "zona rural registrada fuera de Sumapaz; criterio operativo de la guía"}
    severidad: alerta
    fuentes:
      - {doc: O1, ubicacion: "MENOR 5 fila 28", nota: "si la localidad es Sumapaz debe ser 2, de lo contrario 1"}
      - {doc: G1, ubicacion: "p.7", nota: "la única subred que puede realizar encuestas en zona rural es SUR en Sumapaz"}
    accion: "Revisión territorial; no corregir automáticamente."

  - id: M5_ZONA_SUMAPAZ_RURAL
    descripcion: "Si la localidad es Sumapaz, Zona_Urbana = 2"
    tipo: condicional
    variables: [Zona_Urbana]
    aplica_si: {var: Localidad, en: [Sumapaz]}
    parametros: {entonces_cada: {en: [2]}}
    severidad: alerta
    fuentes:
      - {doc: O1, ubicacion: "MENOR 5 fila 28"}
    accion: "Revisión territorial."

  - id: M5_ZONA_P50
    descripcion: "Zona_Urbana concuerda con la ubicación de la vivienda (P50)"
    tipo: condicional
    variables: [Zona_Urbana, P50_Ubicacion_Vivienda]
    parametros:
      entonces:
        alguna:
          - {todas: [{var: Zona_Urbana, en: [1]}, {var: P50_Ubicacion_Vivienda, en: ["Zona Urbana"]}]}
          - {todas: [{var: Zona_Urbana, en: [2]}, {var: P50_Ubicacion_Vivienda, en: ["Zona Rural"]}]}
      explicacion: "la zona de la información básica no coincide con la ubicación de la vivienda"
    severidad: alerta
    fuentes:
      - {doc: G1, ubicacion: "p.22", nota: "P50: verificar concordancia con dirección e información básica"}
      - {doc: D1, ubicacion: "filas 296-297"}
    accion: "Verificar la zona en el formato y en el sistema de información geográfica."

  - id: M5_LOCALIDAD_DOMINIO
    descripcion: "Localidad dentro del listado oficial de Bogotá (se aceptan las formas abreviadas usadas por SIVIGILA)"
    tipo: dominio
    variables: [Localidad]
    parametros: &LOCALIDADES {valores: [Usaquén, Chapinero, Santa Fe, San Cristóbal, Usme, Tunjuelito, Bosa, Kennedy, Fontibón, Engativá, Suba,
                                        Barrios Unidos, Teusaquillo, Los Mártires, Mártires, Antonio Nariño, Puente Aranda, La Candelaria, Candelaria,
                                        Rafael Uribe Uribe, Rafael Uribe, Ciudad Bolívar, Sumapaz]}
    severidad: error
    fuentes:
      - {doc: I1, ubicacion: "p.145", nota: "Anexo 2: número oficial de localidades"}
    accion: "Corregir el nombre de la localidad."

  - id: M5_UPZ_NUMERO_NOMBRE
    descripcion: "Un mismo número de UPZ tiene un único nombre en el archivo"
    tipo: consistencia_grupo
    parametros: {clave: N_UPZ, dependiente: Nombre_UPZ, ignorar: [999]}
    severidad: alerta
    fuentes:
      - {doc: I1, ubicacion: "p.16", nota: "no existe en el Distrito UPZ con el mismo número de identificación"}
    accion: "Verificar la UPZ con MAPAS BOGOTÁ o SINUPOT."

  - id: M5_UPZ_LOCALIDAD
    descripcion: "Un mismo número de UPZ pertenece a una única localidad en el archivo"
    tipo: consistencia_grupo
    parametros: {clave: N_UPZ, dependiente: Localidad, ignorar: [999]}
    severidad: alerta
    fuentes:
      - {doc: D1, ubicacion: "filas 49-50", nota: "UPZ de acuerdo a la localidad"}
      - {doc: I1, ubicacion: "p.145", nota: "Anexo 3: listado de UPZ por localidad"}
    accion: "Verificar localidad y UPZ."

  - id: M5_ESTRATO_DOMINIO
    descripcion: "Estrato entre 1 y 6"
    tipo: dominio
    variables: [Estrato]
    parametros: {valores: [1, 2, 3, 4, 5, 6]}
    severidad: error
    fuentes:
      - {doc: D1, ubicacion: "fila 52"}
    accion: "Verificar el estrato con MAPAS BOGOTÁ o SINUPOT."

  - id: M5_DIRECCION_REPETIDA
    version: 2
    descripcion: "Una dirección no se repite en el archivo, salvo estratos 5 y 6 e inquilinatos (máximo dos encuestas)"
    tipo: unicidad
    variables: [Dirección]
    parametros:
      maximo_por_grupo: 1
      excepcion_maximo: {si: {alguna: [{var: Estrato, en: [5, 6]}, {var: P49_Tipo_Vivienda, en: [Inquilinato]}]}, maximo: 2}
      explicacion: "dirección repetida"
    severidad: alerta
    especiales: "Compara direcciones normalizadas (mayúsculas, tildes y espacios) dentro del archivo. La guía pide revisar todos los meses del año: requiere el histórico anual."
    fuentes:
      - {doc: RV, ubicacion: "Ajustes al validador: inquilinato, hasta 2 encuestas por unidad (SOL-008)"}
      - {doc: O1, ubicacion: "MENOR 5 fila 29"}
      - {doc: G1, ubicacion: "p.7"}
      - {doc: I1, ubicacion: "p.16", nota: "para estratos 5 y 6 se permite más de una encuesta en la misma dirección"}
    accion: "Candidato a revisión: verificar unidad habitacional, inquilinato y complemento antes de decidir duplicidad."

  - id: M5_INQUILINATO_COMPLEMENTO_UN
    descripcion: "Si el tipo de vivienda es inquilinato, la dirección contiene el complemento UN (unidad)"
    tipo: condicional
    variables: [Dirección]
    aplica_si: {var: P49_Tipo_Vivienda, en: [Inquilinato]}
    parametros: {entonces_cada: {patron: ".*\\bUN\\s?\\d+.*"}, explicacion: "inquilinato sin complemento UN en la dirección"}
    severidad: alerta
    fuentes:
      - {doc: O1, ubicacion: "MENOR 5 fila 29"}
      - {doc: G1, ubicacion: "p.22", nota: "ejemplo KR 45 03 20 UN3"}
      - {doc: I1, ubicacion: "p.43"}
    accion: "Completar el complemento de la dirección."


  - id: M5_VIVIENDA_COMPLEMENTO_APTO_IND
    descripcion: "Apartamento independiente: la dirección contiene el complemento AP (apartamento) o PI (piso)"
    tipo: condicional
    estado: provisional
    variables: [Dirección]
    aplica_si: {var: P49_Tipo_Vivienda, en: ["Apartamento (Independiente)"]}
    parametros: {entonces_cada: {patron: "(?i).*\\b(AP|PI)(\\b|\\s?\\d).*"}, esperado: "dirección con complemento AP (apartamento) o PI (piso)", explicacion: "apartamento independiente sin complemento AP o PI: revisar la dirección o el tipo de vivienda"}
    severidad: alerta
    especiales: "Provisional: el equipo debe confirmar la lista de complementos aceptados y si es error o alerta."
    fuentes:
      - {doc: RV, ubicacion: "Ajustes al validador: tipo de vivienda y dirección (SOL-007)"}
      - {doc: O1, ubicacion: "MENOR 5 fila 29"}
    accion: "Completar el complemento de la dirección o corregir el tipo de vivienda."

  - id: M5_VIVIENDA_COMPLEMENTO_APTO_PH
    descripcion: "Apartamento en propiedad horizontal: la dirección contiene el complemento AP"
    tipo: condicional
    estado: provisional
    variables: [Dirección]
    aplica_si: {var: P49_Tipo_Vivienda, en: ["Apartamento (Propiedad horizontal)"]}
    parametros: {entonces_cada: {patron: "(?i).*\\b(AP|APTO)(\\b|\\s?\\d).*"}, esperado: "dirección con complemento AP (apartamento)", explicacion: "apartamento en propiedad horizontal sin complemento AP"}
    severidad: alerta
    especiales: "Provisional: el equipo debe confirmar la lista de complementos aceptados."
    fuentes:
      - {doc: RV, ubicacion: "Ajustes al validador: tipo de vivienda y dirección (SOL-007)"}
      - {doc: O1, ubicacion: "MENOR 5 fila 29"}
    accion: "Completar el complemento de la dirección o corregir el tipo de vivienda."

  - id: M5_VIVIENDA_COMPLEMENTO_CASA_PH
    descripcion: "Casa en propiedad horizontal: la dirección contiene un complemento (CA, IN, BL, TO, MZ…)"
    tipo: condicional
    estado: provisional
    variables: [Dirección]
    aplica_si: {var: P49_Tipo_Vivienda, en: ["Casa (Propiedad Horizontal)"]}
    parametros: {entonces_cada: {patron: "(?i).*\\b(CA|CS|IN|BL|TO|MZ|ET|AG|LT|SM|AP|UN)(\\b|\\s?\\d).*"}, esperado: "dirección con complemento (CA, IN, BL, TO, MZ…)", explicacion: "casa en propiedad horizontal sin complemento en la dirección"}
    severidad: alerta
    especiales: "Provisional: el equipo debe confirmar la lista de complementos aceptados."
    fuentes:
      - {doc: RV, ubicacion: "Ajustes al validador: tipo de vivienda y dirección (SOL-007)"}
      - {doc: O1, ubicacion: "MENOR 5 fila 29"}
    accion: "Completar el complemento de la dirección o corregir el tipo de vivienda."
  # ================================================================= Afiliación y colegio
  - id: M5_SGSS_NINGUNO_SALTO
    descripcion: "Sin afiliación (Ninguno): salto a P3; P2_EAPB y P2_Otra_EAPB = 999"
    tipo: condicional
    variables: [P2_EAPB, P2_Otra_EAPB]
    aplica_si: {var: P1_SGSS, en: [Ninguno]}
    parametros: {entonces_cada: {en: [999]}, explicacion: "sin afiliación pero con EAPB registrada"}
    severidad: error
    fuentes:
      - {doc: I1, ubicacion: "p.18", nota: "contiene salto a la pregunta 3 cuando se selecciona NINGUNO"}
      - {doc: D1, ubicacion: "filas 60-61"}
    accion: "Verificar afiliación con el comprobador de derechos."

  - id: M5_REGIMEN_EXCEPCIONAL_EAPB
    descripcion: "Régimen excepcional: la EAPB corresponde a Fuerzas Militares, Policía, Ecopetrol, Magisterio, universidades públicas, Unisalud o ferrocarriles"
    tipo: condicional
    variables: [P2_EAPB]
    aplica_si: {var: P1_SGSS, en: ["Régimen excepcional"]}
    parametros:
      entonces_cada: {en: ["Fuerzas Militares", "Policía Nacional", "Policia", "Ecopetrol", "Magisterio", "Universidades Públicas", "Unisalud", "Ferrocarriles", "Otro"]}
      explicacion: "régimen excepcional con una EAPB que no pertenece a ese régimen"
    severidad: alerta
    fuentes:
      - {doc: O1, ubicacion: "MENOR 5 filas 37-38"}
      - {doc: G1, ubicacion: "p.9"}
      - {doc: I1, ubicacion: "p.18"}
    accion: "Verificar la EAPB contra el comprobador de derechos."

  - id: M5_EAPB_OTRA
    descripcion: "Si P2_EAPB = Otro, P2_Otra_EAPB tiene el nombre; en otro caso P2_Otra_EAPB = 999"
    tipo: condicional
    variables: [P2_Otra_EAPB]
    estado: provisional
    motivo_estado: "La guía (p.9) describe la relación entre P2_EAPB y P2_Otra_EAPB de forma incompleta; se aplica la práctica observada en la base (Otro + nombre). Confirmar."
    parametros:
      entonces:
        alguna:
