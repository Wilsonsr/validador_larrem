# Reglas – Personas de 5 a 14 años (VEA-8 / AR03). Base B2; diccionario D2; observaciones O1 hoja 5 A 14.
poblaciones: ["5a14"]

listas:
  sintomas: &SINT [P5_Tos_Seca, P6_Tos_Ejercicio_Leve, P7_Tos_Reir_Llorar, P8_Depierta_Tos, P9_Sintomas_Sin_Gripa,
                   P10_Sintomas_Ultimo_Año, P11_Mocos_Nariz_Tapada_Ultimo_Año, P13_Tos_Flemas_Con_Resfrio,
                   P14_TosFlemas_Sin_Resfrio, P15_Tos_Flemas_Dias, P16_Sibilancia_Alguna_Vez, P17_Sibilancia_Ultimo_Año,
                   P18_Sibilancia_Gripa_Ult_Año, P20_Desp_Silbidos_Mas_De_Una_Vez_Semana, P21_Sibilancia_Impide_Habla,
                   P22_Sibilancia_Act_Fisica]
  meses: &MESES [P12_Enero, P12_Febrero, P12_Marzo, P12_Abril, P12_Mayo, P12_Junio, P12_Julio, P12_Agosto, P12_Septiembre,
                 P12_Octubre, P12_Noviembre, P12_Diciembre]
  p34: &P34 [P34_Clima, P34_Flores, P34_Emociones, P34_Humo, P34_Animales, P34_Ropa_Lana, P34_Presencia_Gripa, P34_Comida, P34_Jabon, P34_Otro]
  p39: &P39 [P39_Retirar_Animales, P39_Retirar_Peluches, P39_Disminuir_Consumo_Tabaco, P39_Cambio_Vivienda, P39_Limpieza_Desinfección,
             P39_Cambio_Almohadas, P39_Cambio_Sabanas, P39_Cambios_Estructurales]
  p83: &P83 [P83_Agricultura_Ganaderia, P83_Explotacion_Minas, P83_Venta_Material_Construccion, P83_Reparacion_Vehiculos,
             P83_Restaurantes_Chimenea, P83_Parqueadero_Buses, P83_Bares_Cantinas, P83_Industria_Manufacturera, P83_Incineradores,
             P83_Quemas_Cielo_Abierto, P83_Zona_Reciclaje, P83_Obras_Construccion, P83_Establecimientos_Culto, P83_Ornamentación,
             P83_Canales_Agua, P83_Lavandería]
  mascotas_dep: &MASC [P75_Tiene_Perros, P75_Cuantos_Perros, P75_Tiene_Gatos, P75_Cuantos_Gatos, P75_Tiene_Aves, P75_Cuantas_Aves,
                       P75_Tiene_Otros, P75_Cuantos_Otros, P75_Cuales_Otros, P76_Donde_Duermen_Mascotas, DUERMEN MASCOTAS CODIF.,
                       P77_Niño_Convive_Mascotas]
  diligenciado_no_999: &DIL {todas: [{vacio: false}, {no_en: [999]}]}
  localidades: &LOC [Usaquén, Chapinero, Santa Fe, San Cristóbal, Usme, Tunjuelito, Bosa, Kennedy, Fontibón, Engativá, Suba,
                     Barrios Unidos, Teusaquillo, Los Mártires, Mártires, Antonio Nariño, Puente Aranda, La Candelaria, Candelaria,
                     Rafael Uribe Uribe, Rafael Uribe, Ciudad Bolívar, Sumapaz]

reglas:
  # ================================================================= A. Información general
  - id: E_ACTA_FORMATO
    descripcion: "Número de acta: AR + 03 (encuesta 5 a 14 años) + sigla de subred + 6 dígitos"
    tipo: patron
    variables: [No_Acta]
    parametros: {patron: "AR03[NSEC]\\d{6}", descripcion_esperado: "AR03 + N/S/E/C + 6 dígitos"}
    severidad: error
    fuentes:
      - {doc: I1, ubicacion: "pp.143-144", nota: "AR03 = Encuesta de prevalencia niños de 5 a 14 años"}
      - {doc: G1, ubicacion: "p.29"}
    accion: "Corregir el número de acta."

  - id: E_TIPODOC_DOMINIO
    descripcion: "Tipo de documento del menor dentro de las opciones documentadas"
    tipo: dominio
    variables: [Tipo_Documento]
    parametros: {valores: [NUIP, "Registro Civil", "Tarjeta de Identidad", PEP, PPT, "Permiso por Proteccion Temporal", "Permiso por Protección Temporal",
                           "Documento de Extranjería", "Cedula Extranjería", "Cédula de Extranjería"]}
    severidad: error
    fuentes:
      - {doc: D2, ubicacion: "filas 9-16"}
      - {doc: I1, ubicacion: "p.59"}
    accion: "Verificar el tipo de documento."

  - id: E_ID_NUMERICO
    descripcion: "Si el documento es NUIP, registro civil o tarjeta de identidad, la identificación contiene solo dígitos"
    tipo: patron
    variables: [Identificación]
    aplica_si: {var: Tipo_Documento, en: [NUIP, "Registro Civil", "Tarjeta de Identidad"]}
    parametros: {patron: "\\d+", descripcion_esperado: "solo dígitos"}
    severidad: error
    fuentes:
      - {doc: G1, ubicacion: "p.30", nota: "valor numérico, sin caracteres adicionales"}
      - {doc: I1, ubicacion: "p.59"}
    accion: "Verificar el número de documento."

  - id: E_ID_DE_SIGLA
    descripcion: "Documento de extranjería: la identificación inicia con la sigla en mayúscula seguida del número"
    tipo: patron
    variables: [Identificación]
    aplica_si: {var: Tipo_Documento, en: ["Documento de Extranjería", PEP, PPT, "Permiso por Proteccion Temporal", "Permiso por Protección Temporal"]}
    parametros: {patron: "[A-Z]{2,4}\\s?\\d+", descripcion_esperado: "sigla en mayúsculas + número"}
    severidad: alerta
    fuentes:
      - {doc: I1, ubicacion: "p.59"}
      - {doc: O1, ubicacion: "5 A 14 fila 10"}
      - {doc: D2, ubicacion: "fila 17"}
    accion: "Completar la sigla del documento."

  - id: E_TI_DESDE_8
    descripcion: "Niño de 8 años o más con documento colombiano: el tipo de documento es Tarjeta de Identidad"
    tipo: condicional
    estado: provisional
    variables: [Tipo_Documento]
    aplica_si: {todas: [{var: Edad, cmp: ">=", valor: 8}, {var: Tipo_Documento, no_en: ["Documento de Extranjería", PEP, PPT, "Permiso por Proteccion Temporal", "Permiso por Protección Temporal"]}]}
    parametros: {entonces_cada: {en: ["Tarjeta de Identidad"]}, esperado: "Tarjeta de Identidad", explicacion: "tiene 8 años o más y no registra tarjeta de identidad: revisar la observación"}
    severidad: alerta
    especiales: "Provisional: el equipo indicó 8 años; la tarjeta de identidad se expide desde los 7. No aplica a documentos de extranjería."
    fuentes:
      - {doc: RV, ubicacion: "5 a 14: tarjeta de identidad desde los 8 años (SOL-005)"}
    accion: "Verificar el tipo de documento con el soporte y la observación."
  - id: E_SEXO_DOMINIO
    descripcion: "Sexo: Hombre, Mujer o Intersexual"
    tipo: dominio
    variables: [Sexo]
    parametros: {valores: [Hombre, Mujer, Intersexual]}
    severidad: error
    fuentes:
      - {doc: I1, ubicacion: "p.60"}
      - {doc: D2, ubicacion: "filas 18-19"}
    accion: "Corregir según el formato. No se infiere el sexo a partir del nombre."

  - id: E_SEXO_COD
    descripcion: "Sexo- Cod: Hombre = 1, Mujer = 2"
    tipo: recodificacion_mapa
    etapa: recodificacion
    parametros:
      origen: Sexo
      destino: "Sexo- Cod"
      mapa: {Hombre: 1, Mujer: 2}
      conflicto: {Intersexual: "la codificación de Intersexual en Sexo- Cod no está documentada"}
    severidad: error
    fuentes:
      - {doc: O1, ubicacion: "5 A 14 fila 12"}
      - {doc: D2, ubicacion: "filas 20-21"}
    accion: "Recalcular a partir de la respuesta original."

  - id: E_EDAD_CALCULADA
    descripcion: "Edad en años cumplidos a la fecha de encuesta coincide con Edad"
    tipo: funcion
    variables: [Edad]
    parametros: {nombre: edad_calculada, args: {nacimiento: Fecha_Nacimiento, encuesta: Fecha_Encuesta, edad: Edad}, opciones: {unidad: anios}}
    severidad: error
    fuentes:
      - {doc: I1, ubicacion: "p.60", nota: "calculada por SIVIGILA con la fecha de nacimiento y la fecha de encuesta"}
      - {doc: O1, ubicacion: "5 A 14 fila 14"}
    accion: "Verificar fechas y edad contra el soporte."

  - id: E_EDAD_POBLACION
    descripcion: "Criterio de inclusión: entre 5 y 14 años a la fecha de encuesta"
    tipo: funcion
    variables: [Fecha_Nacimiento]
    parametros: {nombre: edad_poblacion, args: {nacimiento: Fecha_Nacimiento, encuesta: Fecha_Encuesta, etiqueta: "Edad (calculada)"}, opciones: {unidad: anios, min: 5, max: 14}}
    severidad: bloqueante
    fuentes:
      - {doc: I1, ubicacion: "p.60", nota: "criterio de inclusión de edad: entre 5 y 14 años"}
      - {doc: D2, ubicacion: "fila 23"}
    accion: "Verificar la fecha de nacimiento; si es correcta, el registro no pertenece a esta base."

  - id: E_GRUPO_ETNICO_DOMINIO
    descripcion: "Grupo étnico dentro de las opciones del formato"
    tipo: dominio
    variables: [Grupo_etnico]
    parametros: {valores: [Indígena, ROM, Palenquero, Afrodescendiente, Raizal, Ninguno]}
    severidad: error
    fuentes:
      - {doc: D2, ubicacion: "fila 24"}
    accion: "Corregir según el formato."

  - id: E_CORREO1_FORMATO
    descripcion: "Segundo campo de correo (Correo_Electronico1): sintaxis válida, 8888 o 7777"
    tipo: patron
    variables: [Correo_Electronico1]
    parametros:
      patron: "[^\\s@]+@[^\\s@]+\\.[^\\s@]+"
      permitidos: [8888, 7777]
      no_evaluables: {"9999": "el diccionario admite 9999=Sin dato, la guía no (decisión pendiente)"}
      descripcion_esperado: "correo con @ y dominio, 8888 o 7777"
    severidad: alerta
    fuentes:
      - {doc: O1, ubicacion: "5 A 14 fila 27"}
      - {doc: D2, ubicacion: "filas 47-50"}
    accion: "Verificar el correo."


  - id: E_CORREO1_DIGITACION
    descripcion: "Correo sin errores frecuentes de digitación (gmail, hotmail, outlook; terminación .com)"
    tipo: condicional
    variables: [Correo_Electronico1]
    aplica_si: {var: Correo_Electronico1, patron: ".*@.*"}
    parametros: {entonces_cada: {negar: {patron: "(?i).*@(gmai|gmial|gmil|gmal|gamil|gnail|gmaill|gemail|gmail[a-z]+|hotmai|hotmial|hotmal|hotmil|homail|hotamil|hotmaill|htmail|outlok|outloo|oulook|outlock|outllok|otlook|yaho|yahho|yhaoo)\\.[a-z.]+|.*@(gmail|hotmail|outlook|yahoo)|.*@gmail\\.(co|es|con|cm|om|comm|coom)|.*\\.(con|cm|comm|coom|c0m|cmo|ocm)|.*@.*\\.\\..*|.*\\s.*"}}, esperado: "dominio bien escrito (gmail.com, hotmail.com, outlook.com…) y sin espacios", explicacion: "el dominio o la terminación del correo parece mal digitado"}
    severidad: alerta
    fuentes:
      - {doc: RV, ubicacion: "Ajustes al validador: correo electrónico (SOL-012)"}
    accion: "Verificar el correo con el formato físico (dominio y terminación)."
  - id: E_TIPODOC_ENC_DOMINIO
    descripcion: "Tipo de documento del encuestado dentro de las opciones"
    tipo: dominio
    variables: [Tipo_Documento_Encuestado]
    parametros: {valores: ["Cédula de Ciudadanía", "Cédula de Extranjería", PEP, PPT, "Permiso por Protección Temporal", "Documento de Extranjería"]}
    severidad: error
    fuentes:
      - {doc: D2, ubicacion: "filas 41-44"}
    accion: "Corregir según el formato."

  - id: E_ID_ENC_CC_NUMERICO
    descripcion: "Encuestado con cédula de ciudadanía: identificación con solo dígitos"
    tipo: patron
    variables: [Identificacion_Encuestado]
    aplica_si: {var: Tipo_Documento_Encuestado, en: ["Cédula de Ciudadanía"]}
    parametros: {patron: "\\d+", descripcion_esperado: "solo dígitos"}
    severidad: error
    fuentes:
      - {doc: G1, ubicacion: "p.33"}
    accion: "Verificar el número de documento."

  - id: E_ID_ENC_TEXTO
    descripcion: "La identificación del encuestado se almacena como texto"
    tipo: almacenado_como_texto
    variables: [Identificacion_Encuestado]
    severidad: alerta
    fuentes:
      - {doc: DX, ubicacion: "secciones 2 y 4"}
    accion: "Formatear como texto."

  - id: E_PARENTESCO_REVISION
    descripcion: "Parentesco distinto de madre o padre: verificar soporte en observaciones"
    tipo: revision
    estado: revision_humana
    variables: [Parentesco_Encuestado, Observaciones]
    aplica_si: {var: Parentesco_Encuestado, no_en: [MADRE, PADRE]}
    parametros: {solicitud: "Verificar en observaciones la delegación por sentencia judicial y el soporte."}
    severidad: revision
    fuentes:
      - {doc: O1, ubicacion: "5 A 14 fila 26"}
      - {doc: G1, ubicacion: "p.34"}
      - {doc: I1, ubicacion: "p.65"}

  # ================================================================= Ubicación
  - id: E_ZONA_DOMINIO
    descripcion: "Zona_Urbana: 1 o 2"
    tipo: dominio
    variables: [Zona_Urbana]
    parametros: {valores: [1, 2]}
    severidad: error
    fuentes:
      - {doc: D2, ubicacion: "filas 51-52"}
    accion: "Corregir según el formato."

  - id: E_ZONA_RURAL_SUMAPAZ
    descripcion: "Fuera de Sumapaz, Zona_Urbana = 1"
    tipo: condicional
    variables: [Zona_Urbana]
    aplica_si: {var: Localidad, no_en: [Sumapaz]}
    parametros: {entonces_cada: {en: [1]}, explicacion: "zona rural registrada fuera de Sumapaz"}
    severidad: alerta
    fuentes:
      - {doc: O1, ubicacion: "5 A 14 fila 30"}
      - {doc: G1, ubicacion: "p.34"}
    accion: "Revisión territorial."

  - id: E_ZONA_SUMAPAZ_RURAL
    descripcion: "En Sumapaz, Zona_Urbana = 2"
    tipo: condicional
    variables: [Zona_Urbana]
    aplica_si: {var: Localidad, en: [Sumapaz]}
    parametros: {entonces_cada: {en: [2]}}
    severidad: alerta
    fuentes:
      - {doc: O1, ubicacion: "5 A 14 fila 30"}
    accion: "Revisión territorial."

  - id: E_ZONA_P55
    descripcion: "Zona_Urbana concuerda con la ubicación de la vivienda (P55)"
    tipo: condicional
    variables: [Zona_Urbana, P55_Ubicacion_Vivienda]
    parametros:
      entonces:
        alguna:
          - {todas: [{var: Zona_Urbana, en: [1]}, {var: P55_Ubicacion_Vivienda, en: ["Zona Urbana"]}]}
          - {todas: [{var: Zona_Urbana, en: [2]}, {var: P55_Ubicacion_Vivienda, en: ["Zona Rural"]}]}
      explicacion: "la zona de la información básica no coincide con la ubicación de la vivienda"
    severidad: alerta
    fuentes:
      - {doc: G1, ubicacion: "p.51"}
      - {doc: D2, ubicacion: "filas 322-323"}
    accion: "Verificar la zona."

  - id: E_LOCALIDAD_DOMINIO
    descripcion: "Localidad dentro del listado oficial (se aceptan formas abreviadas)"
    tipo: dominio
    variables: [Localidad]
    parametros: {valores: *LOC}
    severidad: error
    fuentes:
      - {doc: I1, ubicacion: "p.145"}
    accion: "Corregir el nombre de la localidad."

  - id: E_COLEGIO_LOCALIDAD_DOMINIO
    descripcion: "Localidad del colegio dentro del listado de Bogotá o 999"
    tipo: dominio
    variables: [P4_Localidad_Colegio]
    parametros: {valores: [999, Usaquén, Chapinero, Santa Fe, San Cristóbal, Usme, Tunjuelito, Bosa, Kennedy, Fontibón, Engativá, Suba,
                           Barrios Unidos, Teusaquillo, Los Mártires, Mártires, Antonio Nariño, Puente Aranda, La Candelaria, Candelaria,
                           Rafael Uribe Uribe, Rafael Uribe, Ciudad Bolívar, Sumapaz]}
    severidad: alerta
    fuentes:
      - {doc: G1, ubicacion: "p.37", nota: "verificar que el colegio esté ubicado en Bogotá"}
    accion: "Unificar la ortografía de la localidad."

  - id: E_UPZ_NUMERO_NOMBRE
    descripcion: "Un mismo número de UPZ tiene un único nombre en el archivo"
    tipo: consistencia_grupo
    parametros: {clave: N_UPZ, dependiente: Nombre_UPZ, ignorar: [999]}
    severidad: alerta
    fuentes:
      - {doc: I1, ubicacion: "p.64"}
    accion: "Verificar la UPZ."

  - id: E_UPZ_LOCALIDAD
    descripcion: "Un mismo número de UPZ pertenece a una única localidad"
    tipo: consistencia_grupo
    parametros: {clave: N_UPZ, dependiente: Localidad, ignorar: [999]}
    severidad: alerta
    fuentes:
      - {doc: D2, ubicacion: "filas 55-56"}
      - {doc: I1, ubicacion: "p.145"}
    accion: "Verificar localidad y UPZ."

  - id: E_ESTRATO_DOMINIO
    descripcion: "Estrato entre 1 y 6"
    tipo: dominio
    variables: [Estrato]
    parametros: {valores: [1, 2, 3, 4, 5, 6]}
    severidad: error
    fuentes:
      - {doc: D2, ubicacion: "fila 58"}
    accion: "Verificar el estrato."

  - id: E_DIRECCION_REPETIDA
    version: 2
    descripcion: "Una dirección no se repite en el archivo, salvo estratos 5 y 6 e inquilinatos (máximo dos)"
    tipo: unicidad
    variables: [Dirección]
    parametros: {maximo_por_grupo: 1, excepcion_maximo: {si: {alguna: [{var: Estrato, en: [5, 6]}, {var: P54_Tipo_Vivienda, en: [Inquilinato]}]}, maximo: 2}, explicacion: "dirección repetida"}
    severidad: alerta
    especiales: "Dentro del archivo; la revisión anual requiere el histórico."
    fuentes:
      - {doc: RV, ubicacion: "Ajustes al validador: inquilinato, hasta 2 encuestas por unidad (SOL-008)"}
      - {doc: O1, ubicacion: "5 A 14 fila 29"}
      - {doc: G1, ubicacion: "p.34", nota: "verificar que en la misma vivienda no haya dos o más niños en la misma temática"}
      - {doc: I1, ubicacion: "p.64"}
    accion: "Candidato a revisión; no eliminar sin verificar."

  - id: E_INQUILINATO_COMPLEMENTO_UN
    descripcion: "Inquilinato: la dirección contiene el complemento UN"
    tipo: condicional
    variables: [Dirección]
    aplica_si: {var: P54_Tipo_Vivienda, en: [Inquilinato]}
    parametros: {entonces_cada: {patron: ".*\\bUN\\s?\\d+.*"}, explicacion: "inquilinato sin complemento UN"}
    severidad: alerta
    fuentes:
      - {doc: O1, ubicacion: "5 A 14 fila 29"}
      - {doc: G1, ubicacion: "p.51"}
    accion: "Completar el complemento."


  - id: E_VIVIENDA_COMPLEMENTO_APTO_IND
    descripcion: "Apartamento independiente: la dirección contiene el complemento AP (apartamento) o PI (piso)"
    tipo: condicional
    estado: provisional
    variables: [Dirección]
    aplica_si: {var: P54_Tipo_Vivienda, en: ["Apartamento (Independiente)"]}
    parametros: {entonces_cada: {patron: "(?i).*\\b(AP|PI)(\\b|\\s?\\d).*"}, esperado: "dirección con complemento AP (apartamento) o PI (piso)", explicacion: "apartamento independiente sin complemento AP o PI: revisar la dirección o el tipo de vivienda"}
    severidad: alerta
    especiales: "Provisional: el equipo debe confirmar la lista de complementos aceptados y si es error o alerta."
    fuentes:
      - {doc: RV, ubicacion: "Ajustes al validador: tipo de vivienda y dirección (SOL-007)"}
      - {doc: O1, ubicacion: "5 A 14 fila 29"}
    accion: "Completar el complemento de la dirección o corregir el tipo de vivienda."

  - id: E_VIVIENDA_COMPLEMENTO_APTO_PH
    descripcion: "Apartamento en propiedad horizontal: la dirección contiene el complemento AP"
    tipo: condicional
    estado: provisional
    variables: [Dirección]
    aplica_si: {var: P54_Tipo_Vivienda, en: ["Apartamento (Propiedad horizontal)"]}
    parametros: {entonces_cada: {patron: "(?i).*\\b(AP|APTO)(\\b|\\s?\\d).*"}, esperado: "dirección con complemento AP (apartamento)", explicacion: "apartamento en propiedad horizontal sin complemento AP"}
    severidad: alerta
    especiales: "Provisional: el equipo debe confirmar la lista de complementos aceptados."
    fuentes:
      - {doc: RV, ubicacion: "Ajustes al validador: tipo de vivienda y dirección (SOL-007)"}
      - {doc: O1, ubicacion: "5 A 14 fila 29"}
    accion: "Completar el complemento de la dirección o corregir el tipo de vivienda."

  - id: E_VIVIENDA_COMPLEMENTO_CASA_PH
    descripcion: "Casa en propiedad horizontal: la dirección contiene un complemento (CA, IN, BL, TO, MZ…)"
    tipo: condicional
    estado: provisional
    variables: [Dirección]
    aplica_si: {var: P54_Tipo_Vivienda, en: ["Casa (Propiedad Horizontal)"]}
    parametros: {entonces_cada: {patron: "(?i).*\\b(CA|CS|IN|BL|TO|MZ|ET|AG|LT|SM|AP|UN)(\\b|\\s?\\d).*"}, esperado: "dirección con complemento (CA, IN, BL, TO, MZ…)", explicacion: "casa en propiedad horizontal sin complemento en la dirección"}
    severidad: alerta
    especiales: "Provisional: el equipo debe confirmar la lista de complementos aceptados."
    fuentes:
      - {doc: RV, ubicacion: "Ajustes al validador: tipo de vivienda y dirección (SOL-007)"}
      - {doc: O1, ubicacion: "5 A 14 fila 29"}
    accion: "Completar el complemento de la dirección o corregir el tipo de vivienda."
  # ================================================================= Afiliación y colegio
  - id: E_SGSS_NINGUNO_SALTO
    descripcion: "Sin afiliación: salto a P3; P2_EAPB y P2_Otra_EAPB = 999"
    tipo: condicional
    variables: [P2_EAPB, P2_Otra_EAPB]
    aplica_si: {var: P1_SGSS, en: [Ninguno]}
    parametros: {entonces_cada: {en: [999]}}
    severidad: error
    fuentes:
      - {doc: I1, ubicacion: "p.66", nota: "salto a la pregunta 3 cuando se selecciona NINGUNO"}
    accion: "Verificar afiliación."

  - id: E_REGIMEN_EXCEPCIONAL_EAPB
    descripcion: "Régimen excepcional: EAPB del régimen de excepción"
    tipo: condicional
    variables: [P2_EAPB]
