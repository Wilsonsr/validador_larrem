# Decisiones documentales pendientes. Mientras no tengan respuesta, el validador aplica el
# tratamiento indicado en `efecto_en_validador` (normalmente: no evaluable o regla no ejecutada).
# Para registrar la respuesta: complete `respuesta` y `fecha_respuesta`, ajuste las reglas
# enlazadas, suba su `version` y cambie `version_configuracion` en tematica.yaml.

decisiones:
  - id: DP-01
    tema: "Vigencia de los documentos para el primer semestre de 2026"
    poblaciones: [menores5, 5a14, mayores60]
    diferencia: "La portada del instructivo dice v10.0 y su control de cambios incluye la v10.1 de julio de 2026. La guía tiene portada de enero de 2025 y control de cambios v4 de julio de 2026. Las bases son de enero a junio."
    fuentes:
      - {doc: I1, ubicacion: "pp.1 y 142"}
      - {doc: G1, ubicacion: "pp.1 y 82"}
      - {doc: DX, ubicacion: "sección 4, Vigencia"}
    efecto_en_validador: "Las reglas se aplican sin fecha de vigencia. Ninguna regla está marcada como exclusiva de la versión de julio."
    pregunta: "¿Qué versión de la guía y del instructivo rige las encuestas de enero a junio de 2026? ¿Qué cambió en la v10.1 y en la v4?"

  - id: DP-02
    tema: "Edad de 12 meses en la recodificación de edad (menores de 5)"
    poblaciones: [menores5]
    diferencia: "D1 clasifica 2 a 11 meses en la categoría 1 y 12 a 59 meses en la 2. O1 incluye los 12 meses en la categoría 1."
    fuentes:
      - {doc: D1, ubicacion: "filas 20-21"}
      - {doc: O1, ubicacion: "MENOR 5 fila 15"}
    efecto_en_validador: "Los 12 meses se codifican en la categoría 2."
    reglas: [M5_EDAD_COD]
    pregunta: "Un niño de 12 meses, ¿se codifica en la categoría 1 o en la 2?"
    respuesta: "Se aplica el diccionario: 1 = 2 a 11 meses; 2 = 12 a 59 meses."
    fecha_respuesta: 2026-10-20

  - id: DP-03
    tema: "Gas propano en la recodificación de energía para cocinar"
    poblaciones: [menores5, 5a14]
    diferencia: "D1 y D2 incluyen el gas propano en la categoría 1 (riesgo). O1 resume 'gas' en la categoría 2."
    fuentes:
      - {doc: D1, ubicacion: "fila 345"}
      - {doc: D2, ubicacion: "fila 382"}
      - {doc: O1, ubicacion: "MENOR 5 fila 145; 5 A 14 fila 162"}
    efecto_en_validador: "El gas propano se valida como categoría 1."
    reglas: [M5_ENERGIA_COD, E_ENERGIA_COD]
    pregunta: "¿El gas propano es categoría 1 o 2? ¿Se aprueba la tabla completa de energía distinguiendo gas natural y propano?"
    respuesta: "Se aplica el diccionario: el gas propano es categoría 1."
    fecha_respuesta: 2026-10-20

  - id: DP-04
    tema: "Recodificación de cocina no ventilada"
    poblaciones: [menores5, 5a14]
    diferencia: "O1 repite en la ventilación de la cocina el texto de ubicación de la cocina. Se aplica la definición del diccionario: el riesgo corresponde a la opción 2 de la pregunta de ventilación."
    fuentes:
      - {doc: D1, ubicacion: "filas 331-336"}
      - {doc: D2, ubicacion: "filas 368-373"}
      - {doc: O1, ubicacion: "MENOR 5 fila 143; 5 A 14 fila 160"}
      - {doc: I1, ubicacion: "p.47"}
    efecto_en_validador: "Las reglas se ejecutan como provisionales con la definición del diccionario."
    reglas: [M5_COCINA_NO_VENTILADA_COD, E_COCINA_NO_VENTILADA_COD]
    pregunta: "¿Se confirma que COCINA NO VENTILADA CODIF. se obtiene solo de la pregunta de ventilación (riesgo = no ventilada)?"

  - id: DP-05
    tema: "Longitud de la identificación según el tipo de documento"
    poblaciones: [menores5, 5a14, mayores60]
    diferencia: "O1 pide un mínimo de diez dígitos para algunos documentos; G1 da como ejemplo un máximo de diez para NUIP. En el corte hay NUIP y tarjetas de identidad de 11 caracteres."
    fuentes:
      - {doc: O1, ubicacion: "MENOR 5 fila 10; 5 A 14 fila 10"}
      - {doc: G1, ubicacion: "p.5"}
      - {doc: I1, ubicacion: "p.12"}
    efecto_en_validador: "No se valida la longitud. Se valida que el NUIP sea numérico y que la identificación esté almacenada como texto."
    reglas: [PEND_ID_LONGITUD]
    pregunta: "¿Cuál es la longitud mínima y máxima aceptada por tipo de documento (NUIP, TI, CC, CE, PEP, PPT)?"

  - id: DP-06
    tema: "Consumo de exactamente 16 cigarrillos al día (mayores de 60)"
    poblaciones: [mayores60]
    diferencia: "D3 define el nivel severo como 16 y más. O1 dice 1-5, 6-15 y 'mayor a 16', dejando sin categoría el valor 16."
    fuentes:
      - {doc: D3, ubicacion: "filas 192-197"}
      - {doc: O1, ubicacion: "MAYOR 60 fila 90"}
    efecto_en_validador: "16 cigarrillos se valida como severo."
    reglas: [A_NIVEL_CONSUMO]
    pregunta: "¿16 cigarrillos diarios corresponde al nivel moderado o al severo?"
    respuesta: "Se aplica el diccionario: 16 cigarrillos diarios es severo (16 y más)."
    fecha_respuesta: 2026-10-20

  - id: DP-07
    tema: "Número de menores igual al total de personas del hogar"
    poblaciones: [menores5, 5a14]
    diferencia: "O1 impide que el número de menores sea mayor o igual al total de personas; I1 solo prohíbe que sea superior (y que sea cero)."
    fuentes:
      - {doc: I1, ubicacion: "p.45"}
      - {doc: O1, ubicacion: "MENOR 5 fila 133"}
    efecto_en_validador: "Se marca como error solo cuando los menores superan a las personas. La igualdad no se marca."
    reglas: [M5_MENORES_NO_SUPERAN_PERSONAS, E_MENORES_NO_SUPERAN_PERSONAS]
    pregunta: "¿Es válido un hogar en el que todas las personas son menores? Si no, ¿qué severidad tiene?"

  - id: DP-08
    tema: "Tiempo de uso del colchón o almohada en 12 meses (5 a 14)"
    poblaciones: [5a14]
    diferencia: "I1 indica registrar en años a partir de los 12 meses. O1 dice que el valor en meses no debe superar 12."
    fuentes:
      - {doc: I1, ubicacion: "p.96"}
      - {doc: O1, ubicacion: "5 A 14 fila 154"}
      - {doc: D2, ubicacion: "fila 352"}
    efecto_en_validador: "Un valor de 12 en la unidad meses queda como no evaluable."
    reglas: [E_P63_MESES]
    pregunta: "¿Se acepta '12 meses' o debe registrarse como '1 año'?"

  - id: DP-09
    tema: "Relación entre país de procedencia y tipo de documento"
    poblaciones: [menores5, 5a14, mayores60]
    diferencia: "G1 formula una relación restrictiva (documento distinto de NUIP/CC implica país distinto de Colombia). I1 admite país distinto de Colombia con documento colombiano y aclaración."
    fuentes:
      - {doc: G1, ubicacion: "pp.5-6, p.62"}
      - {doc: I1, ubicacion: "p.12"}
    efecto_en_validador: "Se marca como alerta solo un documento extranjero con país Colombia. El caso inverso (documento colombiano con país extranjero) no se valida. No se infiere nacionalidad ni situación migratoria."
    reglas: [COM_PAIS_REQUERIDO_DOC_EXT, A_PAIS_DOC_EXT, PEND_PAIS_DOCUMENTO_COLOMBIANO, PEND_PAIS_DOCUMENTO_COLOMBIANO_A]
    pregunta: "¿Un documento extranjero con país Colombia es error o alerta? ¿Qué aclaración debe tener un documento colombiano con país extranjero?"

  - id: DP-10
    tema: "Opciones de P34 y P39 cuando no aplican (5 a 14)"
    poblaciones: [5a14]
    diferencia: "La documentación indica 999 cuando no aplica la pregunta. La base registra 2 en esas opciones."
    fuentes:
      - {doc: D2, ubicacion: "filas 198-209, 225-233"}
      - {doc: O1, ubicacion: "5 A 14 filas 94-118"}
      - {doc: G1, ubicacion: "p.46"}
    efecto_en_validador: "Se aceptan 1, 2 y 999. Las opciones de P34 y P39 no se incluyen en los controles de salto."
    reglas: [E_DOM_P34_P39, E_P29_SALTO, E_P38_SALTO]
    pregunta: "Cuando la pregunta no aplica, ¿las opciones deben registrarse con 999 o con 2?"

  - id: DP-11
    tema: "Estratos superiores a 3 por localidad"
    poblaciones: [menores5, 5a14, mayores60]
    diferencia: "O1 limita los estratos 4 a 6 a seis localidades, sin catálogo territorial. La lista no incluye localidades como Usaquén o Chapinero."
    fuentes:
      - {doc: O1, ubicacion: "MENOR 5 fila 34; 5 A 14 fila 34; MAYOR 60 fila 29"}
      - {doc: DX, ubicacion: "sección 4, Estrato y localidad"}
    efecto_en_validador: "La regla no se ejecuta. Se valida solo que el estrato esté entre 1 y 6."
    reglas: [PEND_ESTRATO_LOCALIDAD]
    pregunta: "¿La lista de O1 corresponde a las localidades atendidas por una subred? ¿Qué catálogo oficial de estratos debe usarse?"

  - id: DP-12
    tema: "Variables históricas (mayores de 60)"
    poblaciones: [mayores60]
    diferencia: "O1 identifica P27_Cual_Otra como pendiente de eliminar y P32_Combustible/P32_Años como campos del sistema antiguo. D3 repite P32_Años en las filas 271 y 280."
    fuentes:
      - {doc: O1, ubicacion: "MAYOR 60 filas 101, 113-114"}
      - {doc: D3, ubicacion: "filas 229-231, 268-272, 280"}
    efecto_en_validador: "No se exige su diligenciamiento. Se emite una alerta si aparecen datos en esos campos."
    reglas: [A_HISTORICAS_SIN_DATO]
    pregunta: "¿Desde qué fecha se retiran estos campos? ¿Qué valor deben tener mientras sigan en la base?"

  - id: DP-13
    tema: "Código 9999 en teléfono, celular y correo"
    poblaciones: [menores5, 5a14, mayores60]
    diferencia: "El diccionario admite 9999 = Sin dato. O1 indica 8888 (no tiene) o 7777 (no presenta) y 'no más opciones'. G1 pide verificar que no existan 999 ni 9999."
    fuentes:
      - {doc: D1, ubicacion: "filas 34-37, 55, 58"}
      - {doc: D3, ubicacion: "filas 34, 55"}
      - {doc: O1, ubicacion: "MENOR 5 filas 23, 35-36"}
      - {doc: G1, ubicacion: "p.6"}
    efecto_en_validador: "El valor 9999 queda como no evaluable en las reglas de formato de contacto."
    reglas: [COM_TELEFONO_FORMATO, COM_CELULAR_FORMATO, COM_CORREO_FORMATO]
    pregunta: "¿Es válido 9999 en teléfono, celular o correo, o debe corregirse a 8888/7777?"

  - id: DP-14
    tema: "Repetición anual de personas y hogares, y cambio de población por edad"
    poblaciones: [menores5, 5a14, mayores60]
    diferencia: "La guía pide revisar la repetición de direcciones en todos los meses del año. No se define cómo tratar a una persona encuestada en dos cortes ni a un niño que cambia de grupo de edad durante el año."
    fuentes:
      - {doc: G1, ubicacion: "p.7"}
      - {doc: DX, ubicacion: "sección 7, Próxima etapa: concertar la metodología"}
    efecto_en_validador: "Se compara solo dentro de los archivos de la misma ejecución. Las coincidencias de identificación entre poblaciones van a revisión humana."
    reglas: [PEND_REPETICION_ANUAL, COM_IDENTIFICACION_UNICA, COM_IDENTIFICACION_ENTRE_POBLACIONES]
    pregunta: "¿Una persona u hogar puede encuestarse más de una vez en el año? ¿Qué se hace si la misma persona aparece en dos poblaciones?"

  - id: DP-15
    tema: "Momento de entrega de los campos geográficos y de exposición"
    poblaciones: [menores5, 5a14, mayores60]
    diferencia: "Las columnas de coordenadas, ACRE y PM2,5 están vacías en las tres bases del corte."
    fuentes:
      - {doc: DX, ubicacion: "sección 3, Campos geográficos y de exposición pendientes"}
    efecto_en_validador: "Su completitud se valida solo en la etapa de enriquecimiento. Si la columna está vacía en todo el archivo, se informa como no evaluable."
    reglas: [PEND_GEOGRAFIA_EXPOSICION_M5, PEND_GEOGRAFIA_EXPOSICION_E, PEND_GEOGRAFIA_EXPOSICION_A, M5_OBLIGATORIAS_ENRIQUECIMIENTO, E_OBLIGATORIAS_ENRIQUECIMIENTO, A_OBLIGATORIAS_ENRIQUECIMIENTO]
    pregunta: "¿En qué etapa se reciben estos campos y contra qué capa se validan?"
