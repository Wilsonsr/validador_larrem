# Reglas – Personas de 60 años y más (VEA-3 / AR04). Base B3; diccionario D3; observaciones O1 hoja MAYOR 60.
poblaciones: [mayores60]

listas:
  p4: &P4 [P4_Despiesta_Tos, P4_Tos_Noche, P4_Tos_Mañana]
  p5: &P5 [P5_Expectoracion_Levantarse, P5_Expectoracion_DiaNoche, P5_Expectoracion_Purulenta, P5_Expectoracion_Sangre]
  p6: &P6 [P6_Falta_Aire_Ejercicio, P6_Falta_Aire_Caminar_Pendiente, P6_Falta_Aire_Caminar_PropioPaso, P6_Falta_Aire_Reposo]
  p7: &P7 [P7_Dolor_Toracico_Ejercicio, P7_Dolor_Toracico_Reposo]
  p9: &P9 [P9_DX_Asma, P9_DX_EPOC, P9_DX_TB_Pulmonar, P9_DX_Neumonia, P9_DX_CA_Pulmonar]
  p11: &P11 [P11_DX_HTA, P11_DX_Arritmia, P11_DX_Trombosis, P11_DX_Angina_Pecho, P11_DX_IAM, P11_DX_ACV]
  p27: &P27 [P27_Polvo, P27_Gases, P27_Humo, P27_Vapores_Tóxicos]
  combustibles: &COMB [P32_Combustible_Leña, P32_Combustible_Carbón, P32_Combustible_Excrementos, P32_Combustible_Envoltura,
                       P32_Combustible_Cocinol, P32_Combustible_Alcohol]
  anios_comb: &ANIOS [P32_Años_Leña, P32_Años_Carbón, P32_Años_Excrementos, P32_Años_Envoltura, P32_Años_Cocinol, P32_Años_Alcohol]
  p40: &P40 [P40_Agricultura_Ganaderia, P40_Explotacion_Minas, P40_Venta_Material_Construccion, P40_Reparacion_Vehiculos,
             P40_Restaurantes_Chimenea, P40_Parqueadero_Buses, P40_Bares_Cantinas, P40_Industria_Manufacturera, P40_Incineradores,
             P40_Quemas_Cielo_Abierto, P40_Zona_Reciclaje, P40_Obras_Construccion, P40_Establecimientos_Culto, P40_Ornamentación,
             P40_Canales_Agua, P40_Lavandería]
  sintomas: &SINT [P3_Sibilancia_Alguna_Vez, P3_Sibilancia_Ultimo_Mes, P4_Despiesta_Tos, P4_Tos_Noche, P4_Tos_Mañana,
                   P5_Expectoracion_Ultimo_Año, P6_Falta_Aire_Ejercicio, P6_Falta_Aire_Caminar_Pendiente,
                   P6_Falta_Aire_Caminar_PropioPaso, P6_Falta_Aire_Reposo, P7_Dolor_Toracico_Ejercicio, P7_Dolor_Toracico_Reposo]
  diligenciado_no_999: &DIL {todas: [{vacio: false}, {no_en: [999]}]}
  localidades: &LOC [Usaquén, Chapinero, Santa Fe, San Cristóbal, Usme, Tunjuelito, Bosa, Kennedy, Fontibón, Engativá, Suba,
                     Barrios Unidos, Teusaquillo, Los Mártires, Mártires, Antonio Nariño, Puente Aranda, La Candelaria, Candelaria,
                     Rafael Uribe Uribe, Rafael Uribe, Ciudad Bolívar, Sumapaz]

reglas:
  # ================================================================= A–B. Información general y básica
  - id: A_ACTA_FORMATO
    descripcion: "Número de acta: AR + 04 (encuesta adulto mayor) + sigla de subred + 6 dígitos"
    tipo: patron
    variables: [No_Acta]
    parametros: {patron: "AR04[NSEC]\\d{6}", descripcion_esperado: "AR04 + N/S/E/C + 6 dígitos"}
    severidad: error
    fuentes:
      - {doc: I1, ubicacion: "pp.143-144", nota: "AR04 = Encuesta de prevalencia adulto mayor"}
      - {doc: G1, ubicacion: "p.60"}
    accion: "Corregir el número de acta."

  - id: A_TIPODOC_DOMINIO
    descripcion: "Tipo de documento dentro de las opciones documentadas"
    tipo: dominio
    variables: [Tipo_documento]
    parametros: {valores: ["Cédula de Ciudadanía", "Cedula de ciudadanía", "Cédula de Extranjería", PEP, "Permiso por Protección Temporal", PPT, "Documento de Extranjería"]}
    severidad: error
    fuentes:
      - {doc: D3, ubicacion: "filas 9-13"}
      - {doc: O1, ubicacion: "MAYOR 60 fila 9", nota: "CC, CE, DE"}
    accion: "Verificar el tipo de documento."

  - id: A_ID_CC_NUMERICO
    descripcion: "Cédula de ciudadanía: identificación con solo dígitos"
    tipo: patron
    variables: [Identificación]
    aplica_si: {var: Tipo_documento, en: ["Cédula de Ciudadanía", "Cedula de ciudadanía"]}
    parametros: {patron: "\\d+", descripcion_esperado: "solo dígitos"}
    severidad: error
    fuentes:
      - {doc: G1, ubicacion: "p.62", nota: "verificar que no tengan caracteres adicionales"}
      - {doc: O1, ubicacion: "MAYOR 60 fila 10", nota: "número"}
    accion: "Verificar el número de cédula."

  - id: A_ID_DE_SIGLA
    descripcion: "Documento de extranjería: la identificación inicia con la sigla seguida del número"
    tipo: patron
    variables: [Identificación]
    aplica_si: {var: Tipo_documento, en: ["Documento de Extranjería", PEP, PPT, "Permiso por Protección Temporal"]}
    parametros: {patron: "[A-Z]{2,4}\\s?\\d+", descripcion_esperado: "sigla en mayúsculas + número"}
    severidad: alerta
    fuentes:
      - {doc: I1, ubicacion: "p.111"}
    accion: "Completar la sigla del documento."

  - id: A_PAIS_DOC_EXT
    descripcion: "Documento de extranjería: país de procedencia distinto de Colombia"
    tipo: condicional
    variables: [Pais_Procedencia]
    aplica_si: {var: Tipo_documento, en: ["Documento de Extranjería", PEP, PPT, "Permiso por Protección Temporal", "Cédula de Extranjería"]}
    parametros: {entonces_cada: {no_en: [COLOMBIA]}, explicacion: "documento de extranjería con país Colombia"}
    severidad: alerta
    fuentes:
      - {doc: G1, ubicacion: "p.62", nota: "tipos distintos a CC (PEP, PPT y CE) corresponden a país diferente a Colombia"}
    accion: "Verificar documento y país."

  - id: A_SEXO_DOMINIO
    descripcion: "Sexo: Hombre, Mujer o Intersexual"
    tipo: dominio
    variables: [Sexo]
    parametros: {valores: [Hombre, Mujer, Intersexual]}
    severidad: error
    fuentes:
      - {doc: I1, ubicacion: "p.111"}
      - {doc: D3, ubicacion: "filas 15-16"}
    accion: "Corregir según el formato. No se infiere el sexo a partir del nombre."

  - id: A_EDAD_CALCULADA
    descripcion: "Edad en años cumplidos a la fecha de encuesta coincide con Edad"
    tipo: funcion
    variables: [Edad]
    parametros: {nombre: edad_calculada, args: {nacimiento: Fecha_Nacimiento, encuesta: Fecha_Encuesta, edad: Edad}, opciones: {unidad: anios}}
    severidad: error
    fuentes:
      - {doc: I1, ubicacion: "pp.111-112", nota: "sin eximir al encuestador del cálculo para verificar el criterio de inclusión"}
      - {doc: O1, ubicacion: "MAYOR 60 fila 13"}
      - {doc: G1, ubicacion: "p.62"}
    accion: "Verificar fechas y edad contra el soporte."

  - id: A_EDAD_POBLACION
    descripcion: "Criterio de inclusión: 60 años o más a la fecha de encuesta"
    tipo: funcion
    variables: [Fecha_Nacimiento]
    parametros: {nombre: edad_poblacion, args: {nacimiento: Fecha_Nacimiento, encuesta: Fecha_Encuesta, etiqueta: "Edad (calculada)"}, opciones: {unidad: anios, min: 60}}
    severidad: bloqueante
    fuentes:
      - {doc: I1, ubicacion: "p.112", nota: "persona de 60 o más años"}
      - {doc: D3, ubicacion: "fila 18"}
    accion: "Verificar la fecha de nacimiento."

  - id: A_GRUPO_ETNICO_DOMINIO
    descripcion: "Grupo étnico dentro de las opciones"
    tipo: dominio
    variables: [Grupo_etnico]
    parametros: {valores: [Indígena, ROM, Palenquero, Afrodescendiente, Raizal, Ninguno]}
    severidad: error
    fuentes:
      - {doc: D3, ubicacion: "fila 19"}
    accion: "Corregir según el formato."

  - id: A_NIVEL_EDUCATIVO_DOMINIO
    descripcion: "Nivel educativo dentro de las opciones"
    tipo: dominio
    variables: [Nivel_Educativo]
    parametros: {valores: ["Primaria incompleta o en curso", "Primaria completa", "Secundaria incompleta o en curso", "Secundaria completa",
                           "Técnico o tecnología incompleta o en curso", "Técnico o tecnología completa", "Superior incompleta o en curso",
                           "Superior completa", "Sin estudios", "Posgrado"]}
    severidad: error
    fuentes:
      - {doc: D3, ubicacion: "filas 35-44"}
      - {doc: G1, ubicacion: "p.63"}
    accion: "Corregir según el formato."

  - id: A_ZONA_DOMINIO
    descripcion: "Zona_Urbana: 1 o 2"
    tipo: dominio
    variables: [Zona_Urbana]
    parametros: {valores: [1, 2]}
    severidad: error
    fuentes:
      - {doc: D3, ubicacion: "filas 45-46"}
    accion: "Corregir según el formato."

  - id: A_ZONA_RURAL_SUMAPAZ
    descripcion: "Fuera de Sumapaz, Zona_Urbana = 1"
    tipo: condicional
    variables: [Zona_Urbana]
    aplica_si: {var: Localidad, no_en: [Sumapaz]}
    parametros: {entonces_cada: {en: [1]}, explicacion: "zona rural registrada fuera de Sumapaz"}
    severidad: alerta
    fuentes:
      - {doc: O1, ubicacion: "MAYOR 60 fila 23"}
      - {doc: G1, ubicacion: "p.64"}
    accion: "Revisión territorial; no corregir automáticamente."

  - id: A_ZONA_SUMAPAZ_RURAL
    descripcion: "En Sumapaz, Zona_Urbana = 2"
    tipo: condicional
    variables: [Zona_Urbana]
    aplica_si: {var: Localidad, en: [Sumapaz]}
    parametros: {entonces_cada: {en: [2]}}
    severidad: alerta
    fuentes:
      - {doc: O1, ubicacion: "MAYOR 60 fila 23"}
    accion: "Revisión territorial."

  - id: A_LOCALIDAD_DOMINIO
    descripcion: "Localidad dentro del listado oficial (se aceptan formas abreviadas)"
    tipo: dominio
    variables: [Localidad]
    parametros: {valores: *LOC}
    severidad: error
    fuentes:
      - {doc: I1, ubicacion: "p.145"}
    accion: "Corregir el nombre."

  - id: A_UPZ_NUMERO_NOMBRE
    descripcion: "Un mismo número de UPZ tiene un único nombre"
    tipo: consistencia_grupo
    parametros: {clave: N_UPZ, dependiente: Nombre_UPZ, ignorar: [999]}
    severidad: alerta
    fuentes:
      - {doc: I1, ubicacion: "p.114"}
    accion: "Verificar la UPZ."

  - id: A_UPZ_LOCALIDAD
    descripcion: "Un mismo número de UPZ pertenece a una única localidad"
    tipo: consistencia_grupo
    parametros: {clave: N_UPZ, dependiente: Localidad, ignorar: [999]}
    severidad: alerta
    fuentes:
      - {doc: D3, ubicacion: "filas 49-50"}
      - {doc: I1, ubicacion: "p.145"}
    accion: "Verificar localidad y UPZ."

  - id: A_ESTRATO_DOMINIO
    descripcion: "Estrato entre 1 y 6"
    tipo: dominio
    variables: [Estrato]
    parametros: {valores: [1, 2, 3, 4, 5, 6]}
    severidad: error
    fuentes:
      - {doc: D3, ubicacion: "fila 52"}
    accion: "Verificar el estrato."

  - id: A_DIRECCION_REPETIDA
    descripcion: "Una dirección no se repite en el archivo, salvo estratos 5 y 6 (máximo dos)"
    tipo: unicidad
    variables: [Dirección]
    parametros: {maximo_por_grupo: 1, excepcion_maximo: {si: {var: Estrato, en: [5, 6]}, maximo: 2}, explicacion: "dirección repetida"}
    severidad: alerta
    especiales: "Dentro del archivo; la revisión anual requiere el histórico."
    fuentes:
      - {doc: O1, ubicacion: "MAYOR 60 fila 24"}
      - {doc: G1, ubicacion: "p.65"}
      - {doc: I1, ubicacion: "p.114"}
    accion: "Candidato a revisión; no eliminar sin verificar."

  - id: A_INQUILINATO_COMPLEMENTO_UN
    descripcion: "Si P33 es inquilinato, la dirección contiene el complemento UN"
    tipo: condicional
    estado: provisional
    motivo_estado: "O1 MAYOR 60 fila 24 asocia el complemento con P33, pero P33 es la vivienda donde habitó la mayor parte de la vida (I1 p.132), no necesariamente la actual. Confirmar."
    variables: [Dirección]
    aplica_si: {var: P33_Tipo_Vivienda, en: [Inquilinato]}
    parametros: {entonces_cada: {patron: ".*\\bUN\\s?\\d+.*"}, explicacion: "inquilinato sin complemento UN"}
    severidad: alerta
    fuentes:
      - {doc: O1, ubicacion: "MAYOR 60 fila 24"}
      - {doc: G1, ubicacion: "p.78"}
    accion: "Verificar el complemento."

  # ================================================================= Afiliación
  - id: A_SGSS_NINGUNO_SALTO
    descripcion: "Sin afiliación: salto a P3; P2_EPS y P2_Otra_EPS = 999"
    tipo: condicional
    variables: [P2_EPS, P2_Otra_EPS]
    aplica_si: {var: P1_SGSS, en: [Ninguno]}
    parametros: {entonces_cada: {en: [999]}}
    severidad: error
    fuentes:
      - {doc: I1, ubicacion: "p.116", nota: "salto a la pregunta 3 cuando se selecciona Ninguno"}
    accion: "Verificar la afiliación."

  - id: A_REGIMEN_EXCEPCIONAL_EPS
    descripcion: "Régimen excepcional: EAPB del régimen de excepción"
    tipo: condicional
    variables: [P2_EPS]
    aplica_si: {var: P1_SGSS, en: ["Régimen excepcional"]}
    parametros:
      entonces_cada: {en: ["Fuerzas Militares", "Policía Nacional", "Ecopetrol", "Magisterio", "Universidades Públicas", "Unisalud", "Ferrocarriles", "Otro"]}
    severidad: alerta
    fuentes:
      - {doc: O1, ubicacion: "MAYOR 60 filas 32-33"}
      - {doc: G1, ubicacion: "p.67"}
    accion: "Verificar la EAPB."

  - id: A_EPS_OTRA
    descripcion: "Si P2_EPS = Otro, P2_Otra_EPS tiene el nombre; en otro caso 999"
    tipo: condicional
    variables: [P2_Otra_EPS]
    estado: provisional
    motivo_estado: "Relación P2_EPS / P2_Otra_EPS descrita de forma incompleta (G1 p.67); se aplica la práctica observada. Confirmar."
    parametros:
      entonces:
        alguna:
          - {todas: [{var: P2_EPS, en: [Otro]}, {var: P2_Otra_EPS, no_en: [999]}, {var: P2_Otra_EPS, vacio: false}]}
          - {todas: [{var: P2_EPS, no_en: [Otro]}, {var: P2_Otra_EPS, en: [999]}]}
    severidad: alerta
    fuentes:
      - {doc: G1, ubicacion: "p.67"}
      - {doc: D3, ubicacion: "filas 61-62"}
    accion: "Verificar la EAPB."

  # ================================================================= C. Antecedentes en salud
  - id: A_DOM_BINARIOS
    descripcion: "Respuestas SI/NO: 1 o 2"
    tipo: dominio
    variables: [P3_Sibilancia_Alguna_Vez, P4_Despiesta_Tos, P4_Tos_Noche, P4_Tos_Mañana, P4_Sin_Tos, P5_Expectoracion_Ultimo_Año,
                P6_Falta_Aire_Ejercicio, P6_Falta_Aire_Caminar_Pendiente, P6_Falta_Aire_Caminar_PropioPaso, P6_Falta_Aire_Reposo,
                P6_Ninguno, P7_Dolor_Toracico_Ejercicio, P7_Dolor_Toracico_Reposo, P7_Ninguno, P9_DX_Asma, P9_DX_EPOC, P9_DX_TB_Pulmonar,
                P9_DX_Neumonia, P9_DX_CA_Pulmonar, P9_DX_Ninguno, P10_Usa_Oxigeno, P11_DX_HTA, P11_DX_Arritmia, P11_DX_Trombosis,
                P11_DX_Angina_Pecho, P11_DX_IAM, P11_DX_ACV, P11_DX_Ninguno, P31_Cocicó_En_Su_Vida, P37_Funciono_Fabrica_Negocio,
                P39_Construcciones_Cerca, P40_Agricultura_Ganaderia, P40_Explotacion_Minas, P40_Venta_Material_Construccion,
                P40_Reparacion_Vehiculos, P40_Restaurantes_Chimenea, P40_Parqueadero_Buses, P40_Bares_Cantinas,
                P40_Industria_Manufacturera, P40_Incineradores, P40_Quemas_Cielo_Abierto, P40_Zona_Reciclaje, P40_Obras_Construccion,
                P40_Establecimientos_Culto, P40_Ornamentación, P40_Canales_Agua, P40_Lavandería, P40_Ninguno,
                TOS AGRUPADA COFID., DIFICULTAD RESP. AGRUPADA COFID., DOLOR TORACICO AGRUPADA COFID., ALGUN ANTEC RESPIRAT. CODIF.,
                ALGUN ANTEC CARDIOVASC. CODIF., FUENTES FIJAS, TABAQUISMO PESADO, Adulto_Con_Riesgo_Posible, Canalización]
    parametros: {valores: [1, 2]}
    severidad: error
    fuentes:
      - {doc: D3, ubicacion: "filas 63-153, 203, 266-267, 306-307, 315-339"}
      - {doc: O1, ubicacion: "MAYOR 60 filas 35-157"}
      - {doc: G1, ubicacion: "pp.67-81"}
    accion: "Corregir según el formato."

  - id: A_DOM_SI_NO_NSNR
    descripcion: "Respuestas con NS/NR: 1, 2 o 99"
    tipo: dominio
    variables: [P8_Asistió_Consulta_Medica, P12_Cirugia_Torax, P13_Pasa_Tiempo_Aire_Libre, P15_Actividad_Fisica, P18_Fuma,
                P24_Contacto_Fumadores_Pasado, P25_Contacto_Fumadores_Presente, P25_1_Dispositivos_SEAN_SSSN, P27_Exposicion_Toxicos,
                NO ACTIVIDAD FISICA CODIF]
    parametros: {valores: [1, 2, 99]}
    severidad: error
    fuentes:
      - {doc: D3, ubicacion: "filas 113-115, 154-156, 159-161, 170-175, 184, 206, 209-210, 226-228"}
    accion: "Corregir según el formato."

  - id: A_DOM_CON_SALTO
    descripcion: "Respuestas dentro de un salto: 1, 2, 99 o 999"
    tipo: dominio
    variables: [P3_Sibilancia_Ultimo_Mes, P5_Expectoracion_Levantarse, P5_Expectoracion_DiaNoche, P5_Expectoracion_Purulenta,
                P5_Expectoracion_Sangre, P19_Fumó_En_Algun_Momento, P27_Polvo, P27_Gases, P27_Humo, P27_Vapores_Tóxicos,
                P32_Combustible_Leña, P32_Combustible_Carbón, P32_Combustible_Excrementos, P32_Combustible_Envoltura,
                P32_Combustible_Cocinol, P32_Combustible_Alcohol]
    parametros: {valores: [1, 2, 99, 999]}
    severidad: error
    fuentes:
      - {doc: D3, ubicacion: "filas 65-67, 81-92, 185-186, 232-247, 274-278"}
    accion: "Corregir según el formato."

  - id: A_P3_SALTO
    descripcion: "Sin sibilancias alguna vez (P3 = 2): salto a P4; sibilancias en el último mes = 999"
    tipo: condicional
    variables: [P3_Sibilancia_Ultimo_Mes]
    aplica_si: {var: P3_Sibilancia_Alguna_Vez, en: [2]}
    parametros: {entonces_cada: {en: [999]}}
    severidad: error
    especiales: "999 indica salto; su recodificación analítica a 2 (D3 fila 67, O1 fila 36) no se aplica a la captura."
    fuentes:
      - {doc: D3, ubicacion: "filas 63-67"}
      - {doc: G1, ubicacion: "p.67"}
      - {doc: I1, ubicacion: "p.117"}
    accion: "Verificar el salto."

  - id: A_P3_SI
    descripcion: "Con sibilancias alguna vez (P3 = 1): último mes = 1 o 2"
    tipo: condicional
    variables: [P3_Sibilancia_Ultimo_Mes]
    aplica_si: {var: P3_Sibilancia_Alguna_Vez, en: [1]}
    parametros: {entonces_cada: {en: [1, 2]}}
    severidad: error
    fuentes:
      - {doc: D3, ubicacion: "filas 65-66", nota: "se responde cuando la P3 es SI"}
    accion: "Completar desde el formato."

  - id: A_GESTION_SINTOMA
    descripcion: "Sibilancias último mes, expectoración (al levantarse, día/noche, purulenta), falta de aire o dolor torácico en reposo sin consulta médica (P8 ≠ 1): verificar gestión en observaciones"
    tipo: revision
    estado: revision_humana
    variables: [P3_Sibilancia_Ultimo_Mes, P5_Expectoracion_Levantarse, P6_Falta_Aire_Reposo, P7_Dolor_Toracico_Reposo, P8_Asistió_Consulta_Medica, Observaciones]
    aplica_si:
      todas:
        - {var: P8_Asistió_Consulta_Medica, no_en: [1]}
        - alguna:
            - {var: P3_Sibilancia_Ultimo_Mes, en: [1]}
            - {var: P5_Expectoracion_Levantarse, en: [1]}
            - {var: P5_Expectoracion_DiaNoche, en: [1]}
            - {var: P5_Expectoracion_Purulenta, en: [1]}
            - {var: P6_Falta_Aire_Reposo, en: [1]}
            - {var: P7_Dolor_Toracico_Reposo, en: [1]}
    parametros: {solicitud: "Verificar que observaciones registre la gestión (orientación a urgencias o canalización)."}
    severidad: revision
    fuentes:
      - {doc: O1, ubicacion: "MAYOR 60 filas 36, 43-45, 50, 54", nota: "si la respuesta de la P8 es SI no es necesaria la observación"}
      - {doc: G1, ubicacion: "pp.67-69"}

  - id: A_P4_SIN_TOS
    descripcion: "P4_Sin_Tos = 1 solo si las opciones de tos son NO; si hay tos, P4_Sin_Tos = 2"
    tipo: exclusion_ninguno
    variables: [P4_Sin_Tos]
    parametros: {opciones: *P4, ninguno: P4_Sin_Tos}
    severidad: error
    fuentes:
      - {doc: D3, ubicacion: "filas 68-75"}
      - {doc: O1, ubicacion: "MAYOR 60 filas 37-40"}
    accion: "Verificar en el formato."

  - id: A_TOS_AGRUPADA
    descripcion: "TOS AGRUPADA COFID.: 1 si alguna opción de tos de P4 es SI; 2 si ninguna"
